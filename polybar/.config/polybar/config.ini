[colors]
background     = #0d0d0d
background-alt = #1a1a1a
foreground     = #ffffff
muted          = #888888
accent         = #5294e2
secondary      = #e0a552
urgent         = #ff5555

[bar/main]
monitor = ${env:MONITOR:eDP}
bottom = true
width = 100%
height = 29
fixed-center = true
background = ${colors.background}
foreground = ${colors.foreground}

padding-left = 0
padding-right = 2
module-margin = 1

font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "JetBrainsMono Nerd Font:size=12;3"
font-2 = "JetBrainsMono Nerd Font:weight=semibold:size=10;2"

modules-left = i3
modules-center = date
modules-right = pulseaudio wlan bluetooth battery tray

cursor-click = pointer
enable-ipc = true

[module/tray]
type = internal/tray
tray-padding = 0
tray-spacing = 12
tray-size = 50%
tray-background = ${colors.background}

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true

label-focused = %name%
label-focused-foreground = ${colors.background}
label-focused-background = ${colors.accent}
label-focused-padding = 11px
label-focused-font = 3

label-unfocused = %name%
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding = 11px
label-unfocused-font = 3

label-visible = %name%
label-visible-foreground = ${colors.foreground}
label-visible-padding = 11px
label-visible-font = 3

label-urgent = %name%
label-urgent-foreground = ${colors.background}
label-urgent-background = ${colors.urgent}
label-urgent-padding = 11px
label-urgent-font = 3

[module/date]
type = internal/date
interval = 5
date = %a %d %b
time = %H:%M
label = %date% %time%
label-font = 3

[module/wlan]
type = internal/network
interface = wlp1s0
interval = 3.0
format-connected = %{A1:alacritty -e nmtui &:}%{T3 F#5294e2}WIFI %{T- F-}<label-connected>%{A}
label-connected = %essid%
label-connected-font = 3
format-disconnected = %{A1:alacritty -e nmtui &:}<label-disconnected>%{A}
label-disconnected = OFFLINE
label-disconnected-foreground = ${colors.muted}
label-disconnected-font = 3

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/scripts/bluetooth.sh
interval = 5
format = <label>
format-prefix = "BT "
format-prefix-foreground = ${colors.accent}
format-prefix-font = 3
label = %output%
label-font = 3
click-left = alacritty -e bluetuith &

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.accent}
format-volume-prefix-font = 3
format-volume = <label-volume>
label-volume = %percentage:2%%
label-volume-font = 3
label-muted = MUTED
label-muted-foreground = ${colors.muted}
label-muted-font = 3

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
poll-interval = 5
format-charging = <label-charging>
format-charging-prefix = "BAT "
format-charging-prefix-foreground = ${colors.accent}
format-charging-prefix-font = 3
format-discharging = <label-discharging>
format-discharging-prefix = "BAT "
format-discharging-prefix-foreground = ${colors.accent}
format-discharging-prefix-font = 3
format-full = <label-full>
format-full-prefix = "BAT "
format-full-prefix-foreground = ${colors.accent}
format-full-prefix-font = 3
label-charging = %percentage%%+
label-charging-font = 3
label-discharging = %percentage%%
label-discharging-font = 3
label-discharging-foreground = ${colors.foreground}
label-full = FULL
label-full-font = 3
label-full-foreground = ${colors.muted}

[settings]
screenchange-reload = true
pseudo-transparency = false
