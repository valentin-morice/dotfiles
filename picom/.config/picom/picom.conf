# GPU-accelerated compositing. The default "xrender" backend composites on the
# CPU and was the source of the scroll/typing lag.
backend = "glx";

# Tearing is already handled by the amdgpu driver (Option "TearFree" "true" in
# /etc/X11/xorg.conf.d/20-amdgpu.conf). Leaving picom's vsync off avoids a second
# vblank wait stacked on top of TearFree, which would add input latency.
vsync = false;

# Let fullscreen / actively-drawing windows draw straight to screen, bypassing
# the compositor entirely — lowest latency for video, games, full-screen apps.
unredir-if-possible = true;

# Shape shadows to rounded window corners instead of boxing them, and let apps
# set their own opacity via _NET_WM_WINDOW_OPACITY.
detect-rounded-corners = true;
detect-client-opacity = true;

# --- Shadows: scoped to Conky widgets + rofi only ---
# Off globally; the rule below switches it on just for those two classes.
# Note: dunst is deliberately excluded — it renders all stacked notifications as
# a single X window (dunst issue #723), so picom would shadow the whole stack as
# one block rather than per-notification.
shadow = false;
shadow-radius = 12;
shadow-opacity = 0.45;
shadow-offset-x = -12;
shadow-offset-y = -12;

rules = ({
  match = "class_g = 'Conky' || class_g = 'Rofi'";
  shadow = true;
});

# No blur (per preference).
blur-method = "none";

# No fade — keeps things snappy.
fading = false;
