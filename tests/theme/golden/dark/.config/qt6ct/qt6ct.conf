# qt6ct settings, rendered by theme-render. Re-rendered on EVERY theme switch
# on purpose, even when nothing in it changes: qt6ct only watches this
# directory (~/.config/qt6ct), not colors/, so replacing this file is what
# makes running apps reload the palette. theme-render must render it AFTER
# qt6ct.colors.conf. Editing settings in the qt6ct GUI won't stick; the next
# render overwrites them, so change this template instead.
#
# style=Fusion matches QT_STYLE_OVERRIDE in .zshenv. File pickers go through the
# portal (standard_dialogs) so they look the same as in portal-themed Qt apps.
# icon_theme follows the palette's Papirus variant (qBittorrent draws its own
# icons; this covers standard Qt icons in dialogs and menus).
[Appearance]
color_scheme_path=$HOME/.config/qt6ct/colors/theme.conf
custom_palette=true
icon_theme=Papirus-Dark
standard_dialogs=xdgdesktopportal
style=Fusion
