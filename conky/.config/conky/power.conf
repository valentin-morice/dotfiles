dofile(os.getenv("HOME") .. "/.config/conky/common.lua")

local x, y = position('power')

conky.config = merge({
    gap_x = x,
    gap_y = y,
    own_window_title = 'conky-power',
})

conky.text = [[
${color1}─── POWER ──────────────────────────${color}${voffset 12}
${color1}BAT${color}   ${execi 5 awk -v n="$(cat /sys/class/power_supply/BAT0/energy_now)" -v f="$(cat /sys/class/power_supply/BAT0/energy_full)" 'BEGIN{p=n/f*100; if(p>=98) printf "FULL"; else printf "%.0f%%", p}'}${alignr}${execpi 5 ~/.local/bin/conky-bar bat 13}${voffset 3}
${color1}BRT${color}   ${execi 5 brightnessctl -m | awk -F, '{print $4}'}${alignr}${execpi 5 ~/.local/bin/conky-bar brt 13}${voffset 3}
${color1}KEYBOARD${color}${alignr}${execi 2 v=$(cat /sys/class/leds/tpacpi::kbd_backlight/brightness); case $v in 0) echo OFF;; 1) echo LO;; 2) echo HI;; *) echo $v;; esac}${voffset 3}
${color1}PROFILE${color}${alignr}${execi 10 powerprofilesctl get}${voffset 3}
${color3}${execi 5 cat /sys/class/power_supply/BAT0/status}${color}${alignr}${color3}${battery_time BAT0}${color}
]]
