# Lightweight CI for the dotfiles: lints every shell script, vets + builds the
# Go IMAP daemon, enforces the light/dark palette-parity invariant the theme
# engine depends on, golden-tests the rendered configs, bats-tests theme-render's
# flock + atomic-write internals, and bootstraps the whole repo from scratch in
# an Arch container (install.sh with packages skipped). A final non-gating job
# checks the official-repo package set still resolves under current Arch.
# Deliberately does NOT run `sway --validate`: the sway config
# `include`s ~/.config/sway/colors.conf (a theme-rendered file that doesn't exist
# in a bare checkout), so a headless validate can't parse it meaningfully.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint shell scripts
        shell: bash
        run: |
          # Every file with a bash/sh shebang (zsh excluded — shellcheck can't
          # lint zsh; .bats excluded — it's bats syntax, exercised by the `bats`
          # job, and would otherwise be matched via its heredoc'd stub shebangs).
          # -S warning: the repo intentionally uses the `A && B || C` idiom
          # (SC2015, info) in verify-wayland etc.
          mapfile -t files < <(grep -rlE '^#!.*\b(bash|sh)\b' --exclude-dir=.git . | grep -viE '/\.?zsh' | grep -vE '\.bats$')
          printf 'linting %d scripts\n' "${#files[@]}"
          shellcheck -S warning "${files[@]}"

  go:
    name: go (imap-daemon)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: common/imap/.config/imap
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: common/imap/.config/imap/go.mod
          # The module is nested, not at the repo root, so point the build cache
          # at its go.sum (otherwise setup-go warns it can't find one).
          cache-dependency-path: common/imap/.config/imap/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: go build
        run: go build -o /dev/null .

  palette-parity:
    name: palette parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: dark.sh and light.sh must export identical THEME_ keys
        shell: bash
        run: |
          # theme-render assumes every palette defines the same key set; a key
          # present in one theme but not the other renders an empty value (or an
          # envsubst error) only when that theme is selected. Catch it here.
          d="$(grep -oE '^export THEME_[A-Za-z0-9_]+' common/theme/.config/theme/palettes/dark.sh | sort -u)"
          l="$(grep -oE '^export THEME_[A-Za-z0-9_]+' common/theme/.config/theme/palettes/light.sh | sort -u)"
          if ! diff <(echo "$d") <(echo "$l"); then
            echo "palette key mismatch between dark.sh and light.sh (see diff above)"; exit 1
          fi
          printf 'palettes agree on %d keys\n' "$(echo "$d" | wc -l)"

  theme-golden:
    name: theme render golden
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Renders every template for dark + light through the real palettes and
      # envsubst, then diffs against tests/theme/golden/. A template/palette edit
      # that changes a rendered config fails here until the goldens are updated
      # (tests/theme/render-golden.sh --update). envsubst ships in gettext-base,
      # preinstalled on the runner.
      - name: Render both palettes and diff against committed goldens
        run: tests/theme/render-golden.sh

  bats:
    name: bats (theme-render internals)
    runs-on: ubuntu-latest
    # theme-render's flock serialization and atomic-write/symlink handling are
    # shell mechanics the golden job can't see (it only checks rendered output).
    # Run them on real Arch so the flock/util-linux behaviour matches the target.
    container: archlinux:latest
    steps:
      # nodejs for actions/checkout (JS action, no Node in the base image); bats
      # is the runner; gettext gives theme-render its envsubst. flock, grep, sed,
      # awk, mktemp, readlink all ship in base.
      - name: Install bats + theme-render deps
        run: pacman -Syu --noconfirm --needed nodejs git bats gettext
      - uses: actions/checkout@v5
      - name: Run the theme-render bats suite
        run: bats tests/theme/theme-render.bats

  bootstrap:
    name: bootstrap (arch container)
    runs-on: ubuntu-latest
    # Run the REAL install.sh on a bare Arch install and assert it produced a
    # working home. This is the fresh-machine proof the other jobs can't give:
    # it catches stow conflicts, a broken git-identity pin, a daemon that won't
    # build, and a theme render that silently emits nothing. Package install is
    # skipped (DOTFILES_SKIP_PACKAGES=1) — building the full AUR set from source
    # would test Arch/makepkg, not this repo, and take 10-20 flaky minutes.
    container: archlinux:latest
    steps:
      # archlinux:latest ships no Node, which actions/checkout (a JS action)
      # needs, so install it here in a plain `run:` step BEFORE checkout. The
      # rest are install.sh's actual runtime deps once packages are skipped:
      # stow (symlinks), go (imap-daemon), gettext (envsubst, for theme-render),
      # jq (theme-render's VSCodium/bluetuith steps). -Syu (not -Sy) avoids the
      # partial-upgrade lib mismatch that bites long-lived base images.
      - name: Install toolchain (node for checkout + install.sh deps)
        run: pacman -Syu --noconfirm --needed nodejs git stow go gettext jq
      - uses: actions/checkout@v5
      - name: Bootstrap into a pristine $HOME and assert the result
        shell: bash
        run: |
          set -euo pipefail

          # A pristine, empty HOME so stow has nothing to collide with. It must
          # NOT be the checkout's HOME: actions/checkout writes a global
          # ~/.gitconfig (safe.directory), and stow's `git` package would then
          # refuse to link ~/.gitconfig. An empty home is also the honest
          # "fresh machine" this job claims to prove.
          export HOME=/tmp/bootstrap-home
          mkdir -p "$HOME"

          # root owns the checkout; clear git's dubious-ownership guard WITHOUT
          # writing a ~/.gitconfig (that would collide with the stowed one) by
          # using system scope (/etc/gitconfig), which no stow package touches.
          git config --system --add safe.directory '*'

          echo "::group::install.sh (DOTFILES_SKIP_PACKAGES=1)"
          DOTFILES_SKIP_PACKAGES=1 ./install.sh
          echo "::endgroup::"

          echo "Asserting the bootstrap produced a working home:"
          set +e
          fails=0
          pass() { printf '  \033[32mPASS\033[0m %s\n' "$1"; }
          bad()  { printf '  \033[31mFAIL\033[0m %s\n' "$1"; fails=1; }

          # 1. sway config is stow-linked back into the repo. Stow tree-folds:
          #    ~/.config/sway itself is the symlink, `config` a real file inside
          #    it, so resolve and compare against the repo's source file.
          sway_link="$(readlink -f "$HOME/.config/sway/config" 2>/dev/null)"
          sway_src="$(readlink -f "$GITHUB_WORKSPACE/wayland/sway/.config/sway/config" 2>/dev/null)"
          if [ -L "$HOME/.config/sway" ] && [ -n "$sway_link" ] && [ "$sway_link" = "$sway_src" ]; then
            pass "sway config stowed into the repo"
          else
            bad  "sway config not linked into the repo (link=$sway_link src=$sway_src)"
          fi

          # 2. repo-local git identity pinned and NON-EMPTY — the empty-pin bug
          #    (a wrong gitconfig path silently pinning "") that hid for months.
          email="$(git -C "$GITHUB_WORKSPACE" config --local user.email)"
          if [ -n "$email" ]; then pass "git local user.email pinned: $email"
          else bad "git local user.email is empty (the pin bug)"; fi

          # 3. the shared mail backend actually built.
          if [ -x "$HOME/.local/bin/imap-daemon" ] && [ -s "$HOME/.local/bin/imap-daemon" ]; then
            pass "imap-daemon built to ~/.local/bin"
          else bad "imap-daemon missing or not executable"; fi

          # 4. theme-render produced a config AND envsubst substituted every
          #    THEME_ var (a leftover ${THEME_x} means a template/palette drift
          #    that renders a broken config only for the affected theme).
          wb="$HOME/.config/waybar/config"
          if [ -s "$wb" ] && ! grep -q '\${THEME_' "$wb"; then
            pass "waybar config rendered (all THEME_ vars substituted)"
          else bad "waybar config missing/empty or has unsubstituted \${THEME_...}"; fi

          echo
          if [ "$fails" -ne 0 ]; then echo "bootstrap assertions FAILED"; exit 1; fi
          echo "all bootstrap assertions passed"

  package-existence:
    name: package existence (non-gating)
    runs-on: ubuntu-latest
    # Bootstrap-rot guard: an official-repo package can be dropped or renamed out
    # from under install.sh (e.g. moved to the AUR), and nothing would notice
    # until a real fresh install fails. This resolves the whole REPO_PKGS set
    # against current Arch's sync DBs. Non-gating (continue-on-error): it tracks
    # upstream Arch, not this repo's own correctness, so a rename shouldn't turn
    # the whole pipeline red — it surfaces as a warning annotation to act on.
    # AUR packages are excluded: they're not in the sync DBs, and building them
    # from source is exactly what the bootstrap job skips.
    continue-on-error: true
    container: archlinux:latest
    steps:
      - name: Install toolchain (node for checkout)
        run: pacman -Syu --noconfirm --needed nodejs git
      - uses: actions/checkout@v5
      - name: Every official-repo package in install.sh still resolves
        shell: bash
        run: |
          set -euo pipefail
          # The list comes straight from install.sh's REPO_PKGS via its
          # introspection hook — single source of truth, no parsing, can't drift.
          mapfile -t repo < <(DOTFILES_PRINT_PACKAGES=repo ./install.sh)
          [ "${#repo[@]}" -gt 0 ] || { echo "hook returned no packages"; exit 1; }
          printf 'resolving %d official-repo packages against the sync DBs\n' "${#repo[@]}"
          missing=()
          for p in "${repo[@]}"; do
            # -Si queries the sync DBs (no download); non-zero => not in any repo.
            pacman -Si "$p" >/dev/null 2>&1 || missing+=("$p")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::warning title=Package gone from Arch repos::%s\n' "${missing[*]}"
            echo "no longer in the official repos: ${missing[*]}"
            exit 1
          fi
          echo "all ${#repo[@]} official-repo packages still exist"
