# networkmanager-dmenu — the wifi picker behind the waybar network icon.
# Runs in rofi with the base config.rasi list look (same as the clipboard and
# window menus), so it follows the theme like every other menu here.

[dmenu]
pinentry = sh -c 'exec "$HOME/.local/bin/rofi-pinentry"'
# -markup-rows lets `format` below wrap the signal icon in a pango span. rofi
# hands back the raw row text on selection, which is what networkmanager_dmenu
# matches against, so the markup doesn't break picking. Cost: an SSID with a
# literal & < or > is invalid markup and its row renders unstyled.
dmenu_command = rofi -dmenu -i -markup-rows
prompt = wifi ❯
# rofi -a marks the connected network as an "active" row (theme-styled).
highlight = True
compact = True
list_saved = False

# Material Symbols dot-and-arcs signal icons, the same 3-step ramp as the
# waybar network icon (wifi_1_bar = the dot, wifi_2_bar, wifi = full arcs).
# These are Private Use Area codepoints the Nerd Font also fills, so `format`
# MUST keep the explicit font_family span or rofi draws unrelated glyphs.
#
# 61 entries (20 dots, 20 dot+arc, 21 full) on purpose. networkmanager_dmenu
# picks round(strength/100 * (len-1)), which with 3 entries breaks at 25/75;
# waybar splits into equal buckets that break at 33/66. Repeating each icon
# moves this picker's breaks onto waybar's exactly (checked for every 0-100), so
# a network shows the same icon here as in the bar.
wifi_icons = 
# Absolute pango units (1/1024 pt), not percentages: this file goes through
# configparser, where a bare % is interpolation syntax. rise -5120 keeps the
# label vertically centred in its row (a smaller rise lets the bigger icon font
# push the text ~2.5px low); rofi-bluetooth uses the same span.
# {name:<56s}{sec:>13s} = 69 columns: the SSID left, the security type flush
# against the row's right edge. The menu font is monospaced, so padding IS the
# alignment; 69 is how many columns fit after the icon in config.rasi's 720px
# window (measured — 70 overflows and rofi ellipsizes). rofi-bluetooth pads to
# the same ROW_COLS. SSIDs over 56 characters just push the type right.
format = <span font_family='Material Symbols Outlined' weight='500' size='15360' rise='-5120'>{icon}</span>  {name:<56s}<span alpha='36000'>{sec:>13s}</span>

# Wifi passwords go through rofi-pinentry: a one-line rofi input. Without it,
# networkmanager-dmenu reuses dmenu_command above for the password, which opens
# the full-height list window with an empty list and a "Search" placeholder.
# sh -c because waybar's PATH lacks ~/.local/bin and this value isn't
# ~-expanded. (The [dmenu_passphrase] obscure option only applies to that
# dmenu fallback; rofi-pinentry always masks with rofi -password.)
[pinentry]
prompt = password

[editor]
# "Launch Connection Manager": nm-connection-editor when installed, otherwise
# nmtui in the same floating alacritty the old click target used (the class
# must stay in sync with sway's for_window rule).
terminal = alacritty --class netmenu-float
gui_if_available = True
gui = nm-connection-editor

[nmdm]
rescan_delay = 5
