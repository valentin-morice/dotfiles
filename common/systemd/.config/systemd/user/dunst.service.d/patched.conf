# D-Bus activation (notify-send with no dunst running) goes through this unit,
# which would start the stock /usr/bin/dunst. Prefer the per-notification-width
# build from ~/.config/dunst/patched/build, falling back to stock when it isn't
# built yet (fresh machine).
[Service]
ExecStart=
ExecStart=/bin/sh -c 'if [ -x "$HOME/.local/bin/dunst" ]; then exec "$HOME/.local/bin/dunst"; else exec /usr/bin/dunst; fi'
