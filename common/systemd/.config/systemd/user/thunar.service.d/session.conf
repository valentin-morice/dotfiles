# Drop-in over the shipped thunar.service (Type=dbus, ExecStart=Thunar --daemon).
# The daemon itself is defined upstream; the shipped unit carries no [Install], so
# without this file it never starts in the session. Getting it started, and tying
# it to the session's lifetime, is now all this drop-in does.
#
# It used to be called theme-ordering.conf and also carried Wants=/After= on
# dconf.service and the two portal units. That was an attempt at the recurring
# "thunar out of sync" bug — the daemon reads the theme once at startup and then
# ignores every later light/dark switch — on the theory that it came up before
# dconf owned its bus name. The theory was never confirmed (~60 engineered
# dconf-activation races against GTK canaries produced zero deaf clients), the
# ordering was elaborate, and the bug came back anyway. The polkit agent turned
# out to have the identical symptom with no such ordering to blame, which settles
# it: this is not a startup-order problem, so the ordering is gone.
#
# theme-render restarts the daemon on a theme switch instead — which is what
# quitting and relaunching Thunar by hand always did. See the GTK3-daemon block in
# common/theme/.config/theme/theme-render.
[Unit]
PartOf=graphical-session.target
After=graphical-session.target

[Install]
WantedBy=sway-session.target
