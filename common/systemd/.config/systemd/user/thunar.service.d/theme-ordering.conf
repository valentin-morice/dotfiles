# Drop-in over the shipped thunar.service (Type=dbus, ExecStart=Thunar --daemon).
# Only adds ordering + [Install]; the daemon itself is defined upstream.
#
# Problem: the Thunar daemon started at login sometimes never sees theme
# changes. It reads the theme correctly once at startup, then ignores every
# later light/dark switch for the life of the process — the recurring "thunar
# out of sync" bug. A daemon started later in the session behaves fine, which
# is why quitting and relaunching Thunar has always "fixed" it.
#
# Ordering is the suspect. On the 2026-07-15 login the journal showed:
#     55.378  Starting Thunar file manager
#     55.401  Starting User preferences database   <- dconf, 23ms LATER
# i.e. the daemon came up while dconf-service (the GSettings backend it reads
# theme changes through) was not yet on the bus. dconf.service is Type=dbus, so
# After= waits until it actually owns ca.desrt.dconf. Wants= is load-bearing:
# without it the unit isn't in the startup transaction and After= is a no-op.
#
# Honest limits of the evidence (do not overstate these later):
#   - CONFIRMED: the login daemon was deaf to theme flips; daemons started once
#     dconf was up followed them, in both directions, via theme-switch.
#   - CONFIRMED: this drop-in reverses the boot order (dconf now starts first).
#   - NOT CONFIRMED: that the dconf race is the actual mechanism. ~60 engineered
#     dconf-activation races against GTK canaries mid-session produced zero deaf
#     clients, so the causal link is inference from the boot ordering, not proof.
#     If the bug returns after a login, this fix is wrong — look elsewhere
#     rather than adding more ordering.
#
# The portal deps are cheap insurance, not the mechanism: Thunar's live theme
# updates arrive via GSettings/dconf.
#
# Launching from the sway config is not an option: sway fires exec lines
# concurrently and mangles quoting on inline shell gates.
[Unit]
Wants=dconf.service xdg-desktop-portal.service xdg-desktop-portal-gtk.service
After=dconf.service xdg-desktop-portal.service xdg-desktop-portal-gtk.service graphical-session.target
PartOf=graphical-session.target

[Install]
WantedBy=sway-session.target
