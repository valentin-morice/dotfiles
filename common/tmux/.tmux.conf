set -g mouse on

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",alacritty:RGB"
set-environment -g COLORTERM "truecolor"

# --- Claude Code inside tmux (https://code.claude.com/docs/en/terminal-config#configure-tmux)
set -g allow-passthrough on          # desktop notifications / progress bar reach alacritty
set -s extended-keys on              # Shift+Enter = newline instead of submit
set -as terminal-features 'xterm*:extkeys'

# --- Colours
# Rendered by theme-render from the active light/dark palette into @theme_* user
# options (accent, accent_text, green, secondary, muted). Every
# style/format below reads them as #{@theme_*} at draw time, so a theme switch
# only re-sources this file — no restart. The ANSI names it replaced broke on
# light: `black` stays near-black in both palettes by design, so black-on-blue
# pills went ~3:1 once the light accent deepened. -q: a fresh clone renders it
# on install; until then the bar just draws uncoloured.
source-file -q ~/.config/tmux/theme.conf

# --- Status bar
set -g status-interval 5
# Two-line status: line 0 is a dim rule framing the pane bottom (mirrors the
# pane-border rule at the top), line 1 is the real bar (tmux's default format).
set -g status 2
# line 1 = tmux's stock status-format[0], copied verbatim (`tmux show-options -gv 'status-format[0]'`)
set -g status-format[1] '#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]'
set -g status-format[0] "#[fg=#{@theme_muted}]#{s/[ x]/─/:#{p-#{client_width}:x}}"
set -g status-style "bg=default,fg=#{@theme_muted}"
set -g status-left-length 30
set -g status-right-length 80
set -g status-left "#{?client_prefix,#[fg=#{@theme_accent_text}#,bg=#{@theme_secondary}#,bold]  PREFIX,#[fg=#{@theme_accent_text}#,bg=#{@theme_accent}#,bold]  #S} #[default] "
# Space after the pane-count glyph: it renders wider than one cell in alacritty's
# non-Mono Nerd Font and otherwise paints over the digit.
set -g window-status-format "#[fg=#{@theme_muted}] #I #W#{?window_zoomed_flag, ,}#{?#{>:#{window_panes},1}, 󰕰 #{window_panes},} "
set -g window-status-current-format "#[fg=#{@theme_accent_text},bg=#{@theme_green},bold] #I #W#{?window_zoomed_flag, ,}#{?#{>:#{window_panes},1}, 󰕰 #{window_panes},} #[default]"
set -g window-status-separator ""
set -g status-right "#[fg=#{@theme_muted}] #{pane_index}/#{window_panes}  #{pane_current_command}  #{b:pane_current_path} #[fg=#{@theme_accent_text},bg=#{@theme_accent},bold]  %H:%M #[default]"

# --- Pane borders: label every pane with its index + running command
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[fg=#{@theme_green}]#[bold],#[fg=#{@theme_muted}]}#P #{pane_current_command} #[default]"
set -g pane-border-style "fg=#{@theme_muted}"
set -g pane-active-border-style "fg=#{@theme_green}"
set -g pane-border-lines single

# --- Ergonomics
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 20000

# --- Plugins (TPM) -----------------------------------------------------------
# TPM lives OUTSIDE the repo at ~/.tmux/plugins/tpm (install.sh clones it and
# runs install_plugins); plugin checkouts land next to it. Keys:
#   prefix I  install listed plugins     prefix U  update     prefix alt+u  prune
set -g @plugin 'tmux-plugins/tpm'
# Sane defaults: escape-time 0 (no lag leaving insert mode in nvim), focus
# events, prefix+R to re-source this file, prefix+C-b for last-window. It only
# sets options still at their default, so nothing above is overridden.
set -g @plugin 'tmux-plugins/tmux-sensible'
# Session save/restore across reboots (prefix+C-s / prefix+C-r), auto-saved
# every 15 min and restored on server start by continuum.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
# Copy-mode selections to the system clipboard (wl-copy on Wayland).
set -g @plugin 'tmux-plugins/tmux-yank'
# C-h/j/k/l move between nvim splits AND tmux panes as one grid (C-\ = last).
# Pairs with the christoomey/vim-tmux-navigator spec in the nvim config.
set -g @plugin 'christoomey/vim-tmux-navigator'
# The plugin takes over bare C-l, so clear-screen moves to prefix+C-l.
bind C-l send-keys 'C-l'
# which-key style cheatsheet of the bindings: prefix+Space.
set -g @plugin 'alexwforsythe/tmux-which-key'
# fzf picker for sessions/windows/panes/commands: prefix+F.
set -g @plugin 'sainnhe/tmux-fzf'
# Fuzzy session switcher (zoxide-aware, previews). Bound to prefix+s in place
# of the stock choose-tree, which it supersedes.
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 's'

# Must stay the last line: TPM sources every plugin above from here.
run '~/.tmux/plugins/tpm/tpm'
