[font]
# 11.5 on the ~165 DPI panel at scale 1.0 — tuned by eye. The desktop stays
# unscaled/crisp, so type is sized per-app rather than via output scale;
# fractional sizes render fine. (The old X11 6.5 only looked right because X
# rendered at the panel's native DPI; Wayland at scale 1.0 is logical ~96 DPI.)
#
# This is deliberately NOT the px = pt * 4/3 match with waybar's 14px (11.5pt
# would be 15.3px there). The exact match was tried and disliked; these are
# by-eye values. rofi tracks this same 11.5.
size = 11.5
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }

[window.padding]
x = 10
y = 8

[general]
import = ["~/.config/alacritty/colors.toml"]

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

# Links (click, or Ctrl+Shift+O) open via open-link instead of plain xdg-open,
# so Firefox on another workspace pulls you over to it rather than just going
# urgent — see ~/.local/bin/open-link for why. Defining a hint replaces
# alacritty's built-in one, so everything else here restates the v0.17 default
# (URL_REGEX in alacritty/src/config/ui_config.rs).
[[hints.enabled]]
command = "open-link"
hyperlinks = true
post_processing = true
persist = false
mouse.enabled = true
binding = { key = "O", mods = "Control|Shift" }
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`\\\\]+"
