[font]
# 11 suits Wayland/sway at output scale 1.0. (The old 6.5 only looked right
# under X11, which rendered it at the panel's native ~170 DPI; Wayland at scale
# 1.0 is ~96 DPI, so the same 6.5pt came out tiny.)
size = 11
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }

[window.padding]
x = 10
y = 8

[general]
import = ["~/.config/alacritty/colors.toml"]

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
