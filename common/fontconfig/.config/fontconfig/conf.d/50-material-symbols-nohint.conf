<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  No hinting for the Material Symbols icon fonts (waybar, rofi cards).

  With the system-wide hintslight, FreeType snaps each glyph's vertical extents
  to the pixel grid on its own, so two icons drawn on the same 24dp grid can
  land 1px apart. Visible on waybar's idle inhibitor: bedtime_off's slash dips
  below the baseline (ink ymin -12 vs bedtime's 75), which shifts the snap and
  drops the moon 1px, so the icon bobs up/down on every toggle. Unhinted, both
  moons render on the same pixel row. An icon font on a fixed design grid gains
  nothing from hinting anyway.

  target="font" + assign, so it wins over GTK's gtk-xft-hintstyle (verified on
  a GTK3 offscreen label under hintslight).
-->
<fontconfig>
  <match target="font">
    <test name="family" compare="contains"><string>Material Symbols</string></test>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
  </match>
</fontconfig>
